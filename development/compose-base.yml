# ベース構成: MySQL + Nginx + adminer (DB管理UI)
# backend / frontend の compose ファイルと組み合わせて使う:
#   docker compose -f compose-base.yml -f compose-backend-go.yml -f compose-frontend-next.yml up -d
services:
  db:
    image: mysql:8.0
    container_name: cleaning-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cleaning
      MYSQL_USER: cleaning
      MYSQL_PASSWORD: cleaning
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --skip-character-set-client-handshake
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ../webapp/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucleaning", "-pcleaning"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:4
    container_name: cleaning-adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: cleaning-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
      - frontend

volumes:
  db-data:
